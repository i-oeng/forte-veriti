# Team frontend (React build in /var/www/forte) + backend on one origin.
# Tailscale Funnel publishes this on https://<host>.ts.net (443 -> 8080).
server {
    listen 8080;
    server_name _;

    root /var/www/forte;
    index index.html;

    client_max_body_size 512M;   # = FORTE_MAX_UPLOAD_MB

    location / {
        try_files $uri $uri/ /index.html;
    }

    # jury API (X-API-Key), key-less UI endpoints, evidence frames / clips, health
    location ~ ^/(api|ui|media)/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
    }
}
